<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>untuk kamu 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Caveat:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#150c1f;
    --bg-panel:#241531;
    --bg-panel-2:#2d1b3d;
    --accent-blush:#f0c2c9;
    --accent-blush-dim:#cd93a6;
    --accent-gold:#e0ab6c;
    --text-cream:#f8efe2;
    --text-muted:#b9a7c6;
    --shadow-deep: 0 24px 60px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100dvh;
    min-height:100vh;
    background:var(--bg-deep);
    color:var(--text-cream);
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  /* ---------- crossfading background layers (same theme, different look per step) ---------- */
  #bgFader{ position:fixed; inset:0; z-index:-1; background:var(--bg-deep); overflow:hidden; }
  .bg-layer{
    position:absolute; inset:-6%; opacity:0;
    transition:opacity 1.3s ease;
    background-color:var(--bg-deep);
    background-repeat:no-repeat;
  }
  .bg-layer.active{ opacity:1; animation:bgDrift 24s ease-in-out infinite alternate; }
  @keyframes bgDrift{
    0%{ transform:scale(1) translate(0,0); }
    100%{ transform:scale(1.07) translate(-1.5%,1.2%); }
  }

  /* ---------- ambient background glow ---------- */
  .glow{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    pointer-events:none;
    z-index:0;
    opacity:.55;
  }
  .glow-1{ width:60vw; height:60vw; max-width:420px; max-height:420px; top:-12%; left:-16%; background:radial-gradient(circle, rgba(224,171,108,.35), transparent 70%); animation:driftA 16s ease-in-out infinite; }
  .glow-2{ width:70vw; height:70vw; max-width:480px; max-height:480px; bottom:-18%; right:-18%; background:radial-gradient(circle, rgba(240,194,201,.32), transparent 70%); animation:driftB 19s ease-in-out infinite; }
  @keyframes driftA{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(18px,14px);} }
  @keyframes driftB{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-16px,-12px);} }

  /* ---------- ambient floating hearts ---------- */
  #floaties{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .floaty{
    position:absolute; bottom:-10%; color:var(--accent-blush); opacity:.32;
    filter:drop-shadow(0 0 6px rgba(240,194,201,.25));
    animation: floatUp linear infinite; user-select:none;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.4; } 90%{ opacity:.32; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(25deg); opacity:0; }
  }

  /* ---------- scene management ---------- */
  .scene{
    position:relative; z-index:1; min-height:100dvh; min-height:100vh;
    display:none; align-items:center; justify-content:center;
    padding:28px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .scene.active{ display:flex; }
  .fade-in{ animation:fadeIn .8s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

  /* ================= ENVELOPE SCENE ================= */
  #scene-envelope{ flex-direction:column; gap:22px; }
  .envelope-caption{
    font-family:'Caveat',cursive;
    font-size:clamp(20px,5.5vw,26px);
    color:var(--accent-blush);
    text-align:center;
    opacity:.9;
  }
  .envelope-stage{
    width:min(80vw,300px);
    position:relative;
  }
  .envelope-wrap{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    cursor:pointer;
    perspective:1000px;
  }
  .env-shadow{
    position:absolute; left:6%; right:6%; bottom:-16px; height:24px;
    background:radial-gradient(ellipse, rgba(0,0,0,.5), transparent 72%);
    filter:blur(3px);
    transition:opacity .4s ease;
  }
  .env-back{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(155deg,var(--bg-panel-2),var(--bg-panel));
    border:1px solid rgba(240,194,201,.16);
    border-radius:10px;
    box-shadow:var(--shadow-deep);
  }
  .letter-peek{
    position:absolute; z-index:2;
    left:50%; width:76%; height:66%;
    top:58%;
    transform:translate(-50%,0) scale(.82);
    opacity:0;
    background:linear-gradient(175deg,#fbf3e6,var(--text-cream));
    border-radius:8px 8px 4px 4px;
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:14px;
    transition:top .75s cubic-bezier(.22,.85,.28,1) .28s,
               transform .75s cubic-bezier(.22,.85,.28,1) .28s,
               opacity .5s ease .28s;
  }
  .letter-peek span{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(18px,5vw,22px);
    color:#3a2440;
  }
  .env-pocket{
    position:absolute; inset:0; z-index:3;
    clip-path:polygon(0% 100%, 100% 100%, 50% 44%);
    background:linear-gradient(200deg,#3c2549,#28182f);
    border-radius:0 0 10px 10px;
  }
  .env-pocket::after{
    content:''; position:absolute; left:8%; right:8%; bottom:10%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(224,171,108,.35),transparent);
  }
  .env-flap{
    position:absolute; top:0; left:0; width:100%; height:54%; z-index:4;
    background:linear-gradient(160deg,#2e1c3a,#1d1226);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:transform .65s cubic-bezier(.3,.85,.3,1);
    border-bottom:1px solid rgba(240,194,201,.12);
  }
  .env-seal{
    position:absolute; z-index:5;
    top:44%; left:50%; width:36px; height:36px;
    background:radial-gradient(circle at 35% 30%, var(--accent-gold), #a8703a 78%);
    border-radius:50%; transform:translate(-50%,-50%);
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; font-size:15px;
    transition:opacity .3s ease, transform .3s ease;
  }

  .envelope-wrap.opened .env-flap{ transform:rotateX(180deg); z-index:1; }
  .envelope-wrap.opened .letter-peek{ top:-14%; transform:translate(-50%,0) scale(1); opacity:1; }
  .envelope-wrap.opened .env-seal{ opacity:0; transform:translate(-50%,-50%) scale(.4); }
  .envelope-wrap.opened .env-shadow{ opacity:.6; }

  .tap-hint{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Caveat',cursive; font-size:clamp(18px,5vw,21px);
    color:var(--text-muted); letter-spacing:.3px;
    animation:pulseHint 2.2s ease-in-out infinite;
  }
  .tap-hint .tap-icon{ display:inline-block; animation:tapBounce 1.6s ease-in-out infinite; }
  @keyframes pulseHint{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  @keyframes tapBounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  /* ================= LETTER SCENE ================= */
  #scene-letter{ align-items:stretch; }
  .letter-card{
    width:100%; max-width:480px; margin:auto;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid rgba(240,194,201,.14);
    border-radius:20px;
    padding:clamp(26px,7vw,40px) clamp(20px,6vw,32px);
    box-shadow:var(--shadow-deep);
    position:relative;
  }
  .letter-card::before{
    content:''; position:absolute; top:0; left:26px; right:26px; height:1px;
    background:linear-gradient(90deg,transparent,var(--accent-gold),transparent);
    opacity:.5;
  }

  #stepOuter{ overflow:hidden; transition:height .45s cubic-bezier(.3,.85,.3,1); }
  #stepWrap{ transition:opacity .26s ease, transform .26s ease; opacity:1; transform:translateY(0); }
  #stepWrap.leaving{ opacity:0; transform:translateY(-6px); }

  .eyebrow{
    font-family:'Caveat',cursive; color:var(--accent-blush);
    font-size:clamp(18px,5vw,20px); letter-spacing:.4px; margin:0 0 8px;
  }
  .letter-body p{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(18px,4.6vw,21px);
    line-height:1.62; color:var(--text-cream); margin:0 0 14px;
  }
  .letter-body p:last-child{ margin-bottom:0; }
  .letter-line{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(17px,4.4vw,20px);
    line-height:1.62; color:var(--text-cream); margin:0;
  }
  .heart-divider{
    display:flex; align-items:center; gap:10px;
    margin:22px 0; color:var(--accent-gold); opacity:.55;
    font-size:12px;
  }
  .heart-divider::before, .heart-divider::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg,transparent,rgba(224,171,108,.4),transparent);
  }

  .small-link{
    background:none; border:none; font-family:'Poppins',sans-serif;
    font-size:14.5px; color:var(--text-muted);
    text-decoration:underline; text-underline-offset:4px;
    cursor:pointer; padding:10px 0; display:block; text-align:left;
    transition:color .3s ease, letter-spacing .3s ease;
  }
  .small-link:active{ color:var(--accent-blush); }
  @media (hover:hover){ .small-link:hover{ color:var(--accent-blush); letter-spacing:.3px; } }

  .btn{
    font-family:'Poppins',sans-serif; font-size:15px; font-weight:500;
    padding:13px 28px; min-height:46px; border-radius:999px; cursor:pointer;
    border:1px solid transparent;
    transition:transform .22s ease, box-shadow .22s ease, background .3s ease, left .2s ease, top .2s ease;
    white-space:nowrap;
  }
  .btn-solid{
    background:linear-gradient(135deg,var(--accent-blush),var(--accent-blush-dim));
    color:#2a1030; box-shadow:0 10px 24px rgba(240,194,201,.28);
  }
  .btn-solid:active{ transform:scale(.97); }
  @media (hover:hover){ .btn-solid:hover{ transform:translateY(-2px) scale(1.02); box-shadow:0 14px 30px rgba(240,194,201,.4); } }
  .btn-ghost{ background:rgba(255,255,255,.03); border-color:rgba(240,194,201,.4); color:var(--text-cream); }
  @media (hover:hover){ .btn-ghost:hover{ background:rgba(240,194,201,.08); } }

  .btn-center{ text-align:center; margin-top:20px; }

  .reveal-inline{ max-height:0; opacity:0; overflow:hidden; transition:max-height .7s cubic-bezier(.2,.8,.3,1), opacity .5s ease, margin-top .5s ease; }
  .reveal-inline.show{ max-height:400px; opacity:1; margin-top:20px; }
  .question-text{
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(18px,4.8vw,20px); text-align:center; color:var(--accent-blush); margin:0 0 4px;
  }

  .choice-row{
    position:relative; display:flex; align-items:center; justify-content:center;
    gap:14px; flex-wrap:wrap; min-height:56px; margin-top:20px;
    transition:min-height .3s ease;
  }
  .choice-row.roomy{ min-height:150px; }
  #btnNo.dodging{ position:absolute; }

  /* ================= FINAL SCENES ================= */
  .final-title{
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(24px,7vw,28px); color:var(--accent-blush); margin:0 0 12px; text-align:center;
  }
  .heart-wrap{ position:relative; width:100%; max-width:270px; aspect-ratio:280/250; margin:4px auto 16px; }
  .heart-wrap span{
    position:absolute; font-family:'Caveat',cursive;
    font-size:clamp(10px,3vw,13px); color:var(--accent-blush); white-space:nowrap;
    opacity:0; transform:translate(-50%,-50%) scale(.5);
    animation:popIn .5s ease forwards;
  }
  @keyframes popIn{ to{ opacity:1; transform:translate(-50%,-50%) scale(1);} }
  .soft-note{
    font-family:'Cormorant Garamond',serif; font-size:clamp(16px,4.4vw,19px);
    color:var(--text-muted); line-height:1.6; text-align:center; margin-top:14px;
  }

  /* ---------- confetti hearts ---------- */
  .confetti-heart{
    position:fixed; z-index:20; pointer-events:none;
    font-size:18px; color:var(--accent-blush);
    animation:confettiPop .9s ease-out forwards;
  }
  @keyframes confettiPop{
    0%{ transform:translate(0,0) scale(.6) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--cx),var(--cy)) scale(1) rotate(var(--cr)); opacity:0; }
  }

  .replay{
    position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); right:14px;
    background:rgba(21,12,31,.6); backdrop-filter:blur(4px);
    border:1px solid rgba(240,194,201,.15);
    color:var(--text-muted); font-family:'Poppins',sans-serif; font-size:11.5px;
    padding:7px 12px; border-radius:999px;
    opacity:.55; cursor:pointer; z-index:5; transition:opacity .3s ease;
  }
  .replay:active{ opacity:1; }
  @media (hover:hover){ .replay:hover{ opacity:.95; } }

  @media (max-width:380px){
    .letter-card{ border-radius:16px; }
  }

  /* ---------- teks muncul pelan per-huruf (fade murni, tanpa gerak) ---------- */
  .char-reveal{
    display:inline-block;
    opacity:0;
    animation:charRise .3s ease forwards;
  }
  /* bungkus tiap kata biar baris cuma patah di antar-kata,
     bukan di tengah kata (fix huruf/kata kepotong pas wrap) */
  .word-reveal{
    display:inline-block;
    white-space:nowrap;
  }
  @keyframes charRise{
    to{ opacity:1; }
  }

  /* ---------- stiker bergerak ---------- */
  @keyframes stickerPop{
    from{ transform:scale(0) rotate(var(--rot,0deg)); opacity:0; }
    to{ transform:scale(1) rotate(var(--rot,0deg)); opacity:1; }
  }
  /* goyang + bob: kayak dadah lembut, bukan cuma naik-turun */
  @keyframes stickerBob{
    0%,100%{ transform:translateY(0) rotate(var(--rot,0deg)); }
    25%{ transform:translateY(-4px) rotate(calc(var(--rot,0deg) + 5deg)); }
    50%{ transform:translateY(-9px) rotate(var(--rot,0deg)); }
    75%{ transform:translateY(-4px) rotate(calc(var(--rot,0deg) - 5deg)); }
  }
  /* pembungkus stiker, tempat nempelnya hati-hati mini yang terbang */
  .sticker-wrap{ position:relative; display:inline-block; }
  .mini-heart{
    position:absolute;
    font-size:15px;
    line-height:1;
    opacity:0;
    pointer-events:none;
    z-index:7;
    animation:heartFloat 2.6s ease-in infinite;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }
  /* hati terbang naik sambil membesar-mengecil kayak detak jantung, lalu memudar */
  @keyframes heartFloat{
    0%{ transform:translate(0,0) scale(.3); opacity:0; }
    10%{ opacity:1; transform:translate(0,-4px) scale(1); }
    30%{ transform:translate(calc(var(--dx,10px)*.4),-20px) scale(1.25); }
    45%{ transform:translate(calc(var(--dx,10px)*.6),-28px) scale(.95); }
    60%{ transform:translate(calc(var(--dx,10px)*.85),-38px) scale(1.15); opacity:1; }
    85%{ opacity:.55; }
    100%{ transform:translate(var(--dx,10px),-58px) scale(.6); opacity:0; }
  }
  .sticker-heading{
    display:block;
    width:min(30vw,118px);
    height:auto;
    margin:-20px auto 10px;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));
    animation:stickerPop .6s cubic-bezier(.34,1.56,.64,1) both,
              stickerBob 4.6s ease-in-out .6s infinite;
  }
  .sticker-env{
    position:absolute; z-index:6;
    top:-30px; right:-9%;
    width:min(22vw,80px);
    height:auto;
    border-radius:16px;
    background:var(--text-cream);
    padding:4px;
    box-shadow:0 10px 22px rgba(0,0,0,.4);
    animation:stickerPop .6s cubic-bezier(.34,1.56,.64,1) both,
              stickerBob 5.2s ease-in-out .6s infinite;
  }
  .sticker-final{
    display:block;
    width:min(32vw,124px);
    height:auto;
    margin:20px auto 0;
    border-radius:18px;
    background:var(--text-cream);
    padding:5px;
    box-shadow:0 10px 22px rgba(0,0,0,.4);
    animation:stickerPop .6s cubic-bezier(.34,1.56,.64,1) both,
              stickerBob 4.9s ease-in-out .6s infinite;
  }
</style>
</head>
<body>

<div id="bgFader">
  <div class="bg-layer active" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>
</div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div id="floaties"></div>

<!-- SCENE 1: ENVELOPE -->
<section class="scene active" id="scene-envelope">
  <p class="envelope-caption">sebuah surat, untukmu</p>

<script>
/* ================= ambient floaties ================= */
(function(){
  const container = document.getElementById('floaties');
  const glyphs = ['❤','♡','✿'];
  const count = window.innerWidth < 480 ? 9 : 15;
  for(let i=0;i<count;i++){
    const el = document.createElement('span');
    el.className = 'floaty';
    el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const size = 9 + Math.random()*15;
    el.style.left = Math.random()*100 + 'vw';
    el.style.fontSize = size + 'px';
    el.style.setProperty('--drift', (Math.random()*70-35)+'px');
    const dur = 11 + Math.random()*14;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random()*dur) + 's';
    container.appendChild(el);
  }
})();

/* ================= scene switching ================= */
function showScene(id){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ================= envelope ================= */
const envelope = document.getElementById('envelope');
const tapHint = document.querySelector('.tap-hint');
const envCaption = document.querySelector('.envelope-caption');
let envelopeOpened = false;
envelope.addEventListener('click', ()=>{
  if(envelopeOpened) return;
  envelopeOpened = true;
  envelope.classList.add('opened');
  tapHint.style.opacity = '0';
  envCaption.style.opacity = '0';
  setTimeout(()=>{
    showScene('scene-letter');
    goToStep('main');
  }, 3000);
});

/* ================= crossfading background ================= */
// Tetap satu keluarga warna (ungu gelap + blush + gold), tapi tiap tema
// nyusun 3 radial-gradient di posisi & intensitas beda supaya kerasa
// lebih "hidup" dan mewah, bukan cuma gonta-ganti warna polos.
const bgThemes = [
  'radial-gradient(circle at 18% 20%, rgba(224,171,108,.32) 0%, transparent 42%), radial-gradient(circle at 88% 12%, rgba(240,194,201,.24) 0%, transparent 46%), radial-gradient(circle at 45% 92%, rgba(205,147,166,.20) 0%, transparent 55%)',
  'radial-gradient(circle at 82% 22%, rgba(240,194,201,.30) 0%, transparent 44%), radial-gradient(circle at 12% 78%, rgba(224,171,108,.24) 0%, transparent 48%), radial-gradient(circle at 55% 8%, rgba(205,147,166,.16) 0%, transparent 50%)',
  'radial-gradient(circle at 50% 88%, rgba(205,147,166,.28) 0%, transparent 46%), radial-gradient(circle at 20% 15%, rgba(224,171,108,.22) 0%, transparent 42%), radial-gradient(circle at 85% 55%, rgba(240,194,201,.18) 0%, transparent 50%)',
  'radial-gradient(circle at 15% 75%, rgba(224,171,108,.30) 0%, transparent 45%), radial-gradient(circle at 78% 82%, rgba(240,194,201,.22) 0%, transparent 46%), radial-gradient(circle at 40% 8%, rgba(205,147,166,.18) 0%, transparent 52%)',
  'radial-gradient(circle at 70% 62%, rgba(240,194,201,.26) 0%, transparent 46%), radial-gradient(circle at 25% 28%, rgba(224,171,108,.26) 0%, transparent 44%), radial-gradient(circle at 60% 96%, rgba(205,147,166,.16) 0%, transparent 55%)',
  'radial-gradient(circle at 30% 38%, rgba(224,171,108,.24) 0%, transparent 46%), radial-gradient(circle at 90% 70%, rgba(240,194,201,.28) 0%, transparent 45%), radial-gradient(circle at 10% 92%, rgba(205,147,166,.18) 0%, transparent 50%)'
];
let bgIndex = 0;
let bgActiveIsA = true;
function cycleBackground(){
  const next = bgThemes[bgIndex % bgThemes.length];
  bgIndex++;
  const showEl = document.getElementById(bgActiveIsA ? 'bgB' : 'bgA');
  const hideEl = document.getElementById(bgActiveIsA ? 'bgA' : 'bgB');
  showEl.style.backgroundImage = next;
  hideEl.classList.remove('active');
  showEl.classList.remove('active');
  void showEl.offsetWidth; // reset drift animation tiap ganti
  showEl.classList.add('active');
  bgActiveIsA = !bgActiveIsA;
}

/* ================= teks muncul pelan per-huruf ================= */
function decodeEntities(str){
  const ta = document.createElement('textarea');
  ta.innerHTML = str;
  return ta.value;
}
function escapeChar(ch){
  if(ch === '&') return '&amp;';
  if(ch === '<') return '&lt;';
  if(ch === '>') return '&gt;';
  return ch;
}
function wrapTextChars(text){
  const decoded = decodeEntities(text);
  // pisah jadi potongan kata & spasi; spasi dibiarkan apa adanya
  // (jadi titik patah baris yang sah), tiap kata dibungkus
  // .word-reveal (white-space:nowrap) supaya huruf-huruf dalam
  // satu kata nggak kepotong pas wrap ke baris baru.
  return decoded.replace(/(\s+)|(\S+)/g, (m, spaces, word)=>{
    if(spaces) return spaces;
    const inner = Array.from(word).map(ch=>'<span class="char-reveal">' + escapeChar(ch) + '</span>').join('');
    return '<span class="word-reveal">' + inner + '</span>';
  });
}
function wrapCharsHTML(html){
  const tagRe = /<[^>]+>/g;
  let result = '', lastIndex = 0, match;
  while((match = tagRe.exec(html))){
    result += wrapTextChars(html.slice(lastIndex, match.index));
    result += match[0];
    lastIndex = tagRe.lastIndex;
  }
  result += wrapTextChars(html.slice(lastIndex));
  return result;
}
// step ~.026s/huruf: rata-rata 1 kata (~5 huruf) kebuka tiap ~130ms,
// setara kecepatan baca cepat tapi masih manusiawi.
function animateTextIn(root, opts={}){
  const skipSelector = opts.skipSelector || '';
  const startDelay = opts.startDelay || 0;
  const step = opts.step !== undefined ? opts.step : .026;
  const selector = opts.selector || 'p, .final-title';
  const els = Array.from(root.querySelectorAll(selector)).filter(el=>{
    if(!skipSelector) return true;
    return !el.closest(skipSelector);
  });
  els.forEach(el=>{ el.innerHTML = wrapCharsHTML(el.innerHTML); });
  const chars = [];
  els.forEach(el=> chars.push(...el.querySelectorAll('.char-reveal')));
  chars.forEach((c,i)=>{
    c.style.animationDelay = (startDelay + i*step) + 's';
  });
}

function lockHeight(px){
  stepOuter.style.height = px + 'px';
}
function releaseHeight(){
  stepOuter.style.height = 'auto';
}
/* kept for any leftover calls elsewhere: just release to auto so content
   is never clipped, since the outer wrapper only needs a fixed pixel
   height for the brief crossfade moment during a step swap. */
function syncHeight(){
  releaseHeight();
}

function goToStep(name, opts={}){
  const doSwap = ()=>{
    cycleBackground();
    stepWrap.innerHTML = steps[name](opts);
    // teks utama muncul pelan satu-satu; .question-text ditunda,
    // nanti dianimasikan sendiri pas blok pertanyaannya kebuka.
    animateTextIn(stepWrap, {skipSelector:'.reveal-inline'});
    afterStepRender(name);
    lockHeight(stepWrap.scrollHeight);
    requestAnimationFrame(()=>{ stepWrap.classList.remove('leaving'); });
    clearTimeout(stepOuter._releaseTimer);
    stepOuter._releaseTimer = setTimeout(releaseHeight, 480);
  };
  if(stepWrap.innerHTML.trim() === ''){
    doSwap();
  } else {
    lockHeight(stepWrap.scrollHeight);
    stepWrap.classList.add('leaving');
    setTimeout(doSwap, 260);
  }
}

function afterStepRender(name){
  if(name === 'confess'){
    initDodge();
    const questionBlock = document.getElementById('questionBlock');
    if(!questionBlock.classList.contains('show')){
      setTimeout(()=>{
        questionBlock.classList.add('show');
        animateTextIn(questionBlock, {selector:'.question-text', startDelay:.1});
      }, 1600);
    }
  }
  if(name === 'finalYes'){
    buildHeart();
  }
}

/* delegated click handling for actions rendered inside stepWrap */
stepWrap.addEventListener('click', (e)=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.dataset.action;
  if(action === 'secret') goToStep('secret');
  else if(action === 'lanjut') goToStep('confess');
  else if(action === 'yes'){ burstHearts(target); setTimeout(()=>goToStep('finalYes'), 200); }
  else if(action === 'no') goToStep('finalNo');
  else if(action === 'backChoice') goToStep('confess', {showQuestion:true});
});

/* ================= dodge button ================= */
let dodgeCount = 0;
const isTouch = window.matchMedia('(hover: none)').matches;
const dodgeTexts = [
  'Aku pikir-pikir dulu 😭',
  'Eh tunggu dulu 😳',
  'Bentar mikir lagi 🙈',
  'Yakin nih? 👉👈',
  'Coba tangkep aku 😆',
  'Oke oke aku nyerah 🤣'
];

function initDodge(){
  dodgeCount = 0;
  const choiceRow = document.getElementById('choiceRow');
  const btnNo = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');
  if(!btnNo) return;
  btnNo.textContent = dodgeTexts[0];
  btnNo.classList.remove('dodging');
  btnNo.style.position = '';
  btnNo.style.left = '';
  btnNo.style.top = '';
  btnYes.style.transform = '';
  choiceRow.classList.remove('roomy');

  function dodge(){
    if(dodgeCount >= dodgeTexts.length - 1){
      btnNo.textContent = dodgeTexts[dodgeTexts.length-1];
      btnNo.classList.remove('dodging');
      btnNo.style.position = '';
      btnNo.style.left = '';
      btnNo.style.top = '';
      choiceRow.classList.remove('roomy');
      return;
    }
    choiceRow.classList.add('roomy');
    syncHeight();
    if(!btnNo.classList.contains('dodging')){
      const r0 = btnNo.getBoundingClientRect();
      const row0 = choiceRow.getBoundingClientRect();
      btnNo.style.left = (r0.left - row0.left) + 'px';
      btnNo.style.top = (r0.top - row0.top) + 'px';
      btnNo.classList.add('dodging');
    }
    const row = choiceRow.getBoundingClientRect();
    const btnRect = btnNo.getBoundingClientRect();
    const maxLeft = Math.max(row.width - btnRect.width, 0);
    const maxTop = Math.max(row.height - btnRect.height, 0);
    btnNo.style.left = (Math.random() * maxLeft) + 'px';
    btnNo.style.top = (Math.random() * maxTop) + 'px';
    dodgeCount++;
    btnNo.textContent = dodgeTexts[Math.min(dodgeCount, dodgeTexts.length-1)];
    btnYes.style.transform = 'scale(' + (1 + Math.min(dodgeCount,6)*0.03) + ')';
  }

  if(isTouch){
    btnNo.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
  } else {
    btnNo.addEventListener('mouseenter', dodge);
  }
}

/* ================= confetti burst ================= */
function burstHearts(originEl){
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const glyphs = ['❤','🤍','✿'];
  for(let i=0;i<14;i++){
    const el = document.createElement('span');
    el.className = 'confetti-heart';
    el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*90;
    el.style.setProperty('--cx', Math.cos(angle)*dist + 'px');
    el.style.setProperty('--cy', Math.sin(angle)*dist - 30 + 'px');
    el.style.setProperty('--cr', (Math.random()*140-70) + 'deg');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 950);
  }
}

/* ================= heart signature (final yes) ================= */
function buildHeart(){
  const wrap = document.getElementById('heartWrap');
  if(!wrap) return;
  const words = ['sayang kamu','cinta','🤍'];
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const cx = w/2, cy = h/2 - 6;
  const scale = Math.min(w,h) / 34;
  let idx = 0;
  for(let t = 0; t < Math.PI*2; t += 0.22){
    const x = 16 * Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    const px = cx + x*scale;
    const py = cy + y*scale*0.92;
    const span = document.createElement('span');
    span.textContent = words[idx % words.length];
    span.style.left = px + 'px';
    span.style.top = py + 'px';
    span.style.animationDelay = (idx * 0.045) + 's';
    wrap.appendChild(span);
    idx++;
  }
}

/* ================= replay ================= */
document.getElementById('replayBtn').addEventListener('click', ()=>{
  bgIndex = 0;
  envelopeOpened = false;
  envelope.classList.remove('opened');
  tapHint.style.opacity = '1';
  envCaption.style.opacity = '1';
  stepWrap.innerHTML = '';
  showScene('scene-envelope');
});
</script>
